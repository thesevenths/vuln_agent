# security_controls.yaml — 安全控制模式定义
# 从 code-audit adapters/java.yaml + security_controls_matrix.yaml 迁移
# 用于 auth_mechanisms scanner 识别鉴权/授权机制

controls:
  # ── 身份认证 ──────────────────────────────────────────────────────────────
  authentication:
    cwe: CWE-306
    severity: CRITICAL
    java:
      spring_security:
        - "@PreAuthorize.*isAuthenticated"
        - "@Secured"
        - "SecurityContextHolder\\.getContext\\(\\)\\.getAuthentication\\(\\)"
        - "Principal\\s+principal"
        - "@AuthenticationPrincipal"
        - "httpSecurity.*authenticated\\(\\)"
        - "\\.authenticated\\(\\)"
      shiro:
        - "SecurityUtils\\.getSubject\\(\\)"
        - "subject\\.isAuthenticated\\(\\)"
        - "@RequiresAuthentication"
      jwt:
        - "JwtAuthenticationFilter"
        - "@JwtToken"
        - "parseToken|validateToken"
    python:
      django:
        - "@login_required"
        - "LoginRequiredMixin"
        - "authentication_classes"
      flask:
        - "@login_required"
        - "session\\[.user.\\]"
      fastapi:
        - "Depends.*get_current_user"
        - "OAuth2PasswordBearer"

  # ── 授权检查 ──────────────────────────────────────────────────────────────
  authorization:
    cwe: CWE-862
    severity: CRITICAL
    java:
      spring_security:
        - "@PreAuthorize"
        - "@PostAuthorize"
        - "@Secured\\(.*ROLE_"
        - "@RolesAllowed"
        - "hasRole\\("
        - "hasAuthority\\("
        - "hasPermission\\("
        - "@EnableGlobalMethodSecurity"
        - "@EnableMethodSecurity"
      shiro:
        - "@RequiresRoles"
        - "@RequiresPermissions"
        - "subject\\.isPermitted\\("
        - "subject\\.hasRole\\("
      custom:
        - "checkPrivilege|hasPrivilege"
        - "checkPermission|hasPermission"
        - "isAdmin\\(|isManager\\("
        - "accessControl|aclCheck"
    python:
      django:
        - "@permission_required"
        - "@user_passes_test"
        - "PermissionRequiredMixin"
      flask:
        - "@roles_required"
        - "@roles_accepted"

  # ── 资源所有权验证 ────────────────────────────────────────────────────────
  ownership_check:
    cwe: CWE-639
    severity: HIGH
    java:
      patterns:
        - "getUserId\\(\\)\\.equals\\("
        - "getOwnerId\\(\\)\\.equals\\("
        - "\\.getCreatedBy\\(\\)\\.equals\\("
        - "belongsToUser\\("
        - "isOwner\\("
        - "repository\\.findByIdAndUserId\\("
        - "WHERE.*user_id\\s*="

  # ── CSRF 保护 ─────────────────────────────────────────────────────────────
  csrf_protection:
    cwe: CWE-352
    severity: HIGH
    java:
      patterns:
        - "csrf\\(\\)\\.disable\\(\\)"
        - "CsrfToken"
        - "X-CSRF-TOKEN"
    python:
      django:
        - "@csrf_exempt"
        - "CsrfViewMiddleware"

  # ── 输入验证 ──────────────────────────────────────────────────────────────
  input_validation:
    cwe: CWE-20
    severity: HIGH
    java:
      patterns:
        - "@Valid"
        - "@Validated"
        - "@NotNull|@NotEmpty|@NotBlank"
        - "@Size|@Min|@Max"
        - "@Pattern"
        - "BindingResult"
        - "Validator\\.validate"

  # ── 速率限制 ──────────────────────────────────────────────────────────────
  rate_limit:
    cwe: CWE-307
    severity: MEDIUM
    java:
      patterns:
        - "RateLimiter"
        - "@RateLimit"
        - "Bucket4j"
        - "throttle"
    python:
      patterns:
        - "ratelimit"
        - "throttle_classes"

# ─────────────────────────────────────────────────────────────────────────────
# Spring Security FilterChain 规则解析配置
# 供 java_spring 适配器解析 SecurityFilterChain / authorizeHttpRequests /
# authorizeRequests 中的逐条 URL 规则（permitAll / authenticated / hasRole ...），
# 并据此推断每条 URL 是否需要认证。
#
# 若需新增 matcher 方法或规则关键字，直接改此处即可，无需改代码。
# ─────────────────────────────────────────────────────────────────────────────
spring_security_filter_chain:
  # matcher(...) 方法名（match 后紧跟 .rule(...)）
  matcher_methods:
    - requestMatchers
    - antMatchers
    - mvcMatchers
    - regexMatchers
  # anyRequest() 关键字（无 URL 参数，匹配所有其余请求）
  any_request_keyword: anyRequest
  # 视为「放行（无需认证）」的规则关键字
  permit_rules:
    - permitAll
    - anonymous
  # 视为「受保护（需认证 / 授权）」的规则关键字
  protected_rules:
    - authenticated
    - denyAll
    - hasRole
    - hasAuthority
    - hasAnyRole
    - hasAnyAuthority
