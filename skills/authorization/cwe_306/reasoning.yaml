# CWE-306 分析推理流程

reasoning_workflow:
  - 'Step 0: 【路由×安全配置交叉】枚举关键功能端点，对照 SecurityFilterChain/Shiro security_config/jaxrs 守卫：标记未受保护的关键 API。建立端点认证状态表。'
  - 'Step 0b: 【组件扫描联动】若扫描命中 default_exposure/auth_bypass（如 Actuator、Shiro、Spring Security 规则项）：先验证配置是否触发已知未授权面，再分析业务方法。'
  - 'Step 1: 【识别关键功能】当前函数是否涉及创建/删除敏感实体、PII/金融、系统级操作、资源密集型任务？对照 semantic_keywords 和 logic_query_keywords.critical_ops。'
  - 'Step 2: 【检查显式认证守卫】关键操作前是否有身份验证？检查方法级注解（@PreAuthorize/@login_required/AuthGuard）和全局过滤器覆盖。对照 control_detection_patterns.method_level_auth 和 control_detection_patterns.global_auth_filter。'
  - 'Step 3: 【评估认证状态可靠性】是否用类级布尔标志而非 Session/Token 实时状态？对照 anti_patterns.class_level_boolean_auth。'
  - 'Step 4: 【检查二次通道】调试接口、内部 API、WebSocket、GraphQL、gRPC 是否绕过主认证？对照 anti_patterns.debug_endpoint_exposed 和 anti_patterns.secondary_channel_bypass。'
  - 'Step 5: 【确认客户端校验依赖】仅前端认证、服务端未复验 → 视为缺失认证。'
  - 'Step 6: 【检查认证豁免范围】permitAll/AllowAnonymous 白名单是否误覆盖了关键功能端点？'
  - 'Step 7: 【八项确认标准】缺一不得 confirmed：(1)关键功能已识别 (2)全局过滤器覆盖 (3)方法级认证存在 (4)认证状态可靠 (5)无二次通道绕过 (6)非仅前端校验 (7)认证豁免未误覆盖 (8)组件无已知 auth_bypass'

knowledge_injection:
  few_shot_examples:
    - code_snippet: '@RestController
public class AdminController {
    @GetMapping("/admin/users")
    public List<User> getAllUsers() {
        return userService.findAll();
    }

    @PostMapping("/admin/config")
    public void updateConfig(@RequestBody Config config) {
        configService.update(config);
    }
}'
      vulnerability_analysis: 'AdminController 的所有端点均无 @PreAuthorize/@Secured 注解。若全局 SecurityFilterChain 也未覆盖 /admin/** 路径，则这些管理端点完全无认证保护。攻击者可直接访问 /admin/users 获取所有用户数据，或 POST /admin/config 修改系统配置。'
      fix_pattern: '在类级别添加 @PreAuthorize("hasRole(''ADMIN'')")，或确保 SecurityFilterChain 配置 .requestMatchers("/admin/**").hasRole("ADMIN")。'
    - code_snippet: 'public BankAccount createBankAccount(...) {
    BankAccount account = new BankAccount();
    ...
    return account;
}'
      vulnerability_analysis: createBankAccount 是典型的关键功能（创建金融实体、处理 SSN），但方法体内无任何认证检查。攻击者可直接调用此公开方法创建任意银行账户。
      fix_pattern: 'if (!SecurityContextHolder.getContext().getAuthentication().isAuthenticated()) throw new AccessDeniedException();'
    - code_snippet: '@app.get("/admin/users")
async def get_users():
    return await User.all()

@app.delete("/api/records/{id}")
async def delete_record(id: int):
    await Record.filter(id=id).delete()'
      vulnerability_analysis: 'FastAPI 端点无 Depends(get_current_user) 认证依赖注入。管理端点 /admin/users 和删除端点 /api/records/{id} 完全暴露。攻击者可无认证访问所有用户数据和删除任意记录。'
      fix_pattern: 'async def get_users(current_user: User = Depends(get_current_user)): 和 async def delete_record(id: int, current_user: User = Depends(get_current_user)):'
    - code_snippet: 'app.get(''/admin/dashboard'', (req, res) => {
    res.json(getAdminData());
});

app.post(''/api/system/restart'', (req, res) => {
    restartService();
    res.json({status: ''restarting''});
});'
      vulnerability_analysis: 管理仪表板和系统重启端点均无 authMiddleware。攻击者可直接 GET /admin/dashboard 获取管理数据，POST /api/system/restart 重启服务导致 DoS。
      fix_pattern: 'app.get(''/admin/dashboard'', authMiddleware, requireRole(''admin''), ...); app.post(''/api/system/restart'', authMiddleware, requireRole(''admin''), ...);'
    - code_snippet: 'r.GET("/admin/stats", func(c *gin.Context) {
    c.JSON(200, getStats())
})

r.POST("/api/config/update", func(c *gin.Context) {
    updateConfig(c)
})'
      vulnerability_analysis: Gin 路由无 AuthRequired() 中间件。管理统计和配置更新端点完全暴露。Go 没有框架级认证保护，完全依赖开发者手动添加中间件。
      fix_pattern: 'adminGroup := r.Group("/admin"); adminGroup.Use(AuthRequired()); adminGroup.GET("/stats", getStats)'
    - code_snippet: '[ApiController]
public class AdminController : ControllerBase {
    [HttpGet("admin/secrets")]
    public IActionResult GetSecrets() => Ok(secrets);

    [HttpPost("admin/deploy")]
    public IActionResult Deploy([FromBody] DeployRequest req) {
        // deploy logic
        return Ok();
    }
}'
      vulnerability_analysis: 'AdminController 无 [Authorize] 注解。在 ASP.NET Core 中，缺少 [Authorize] 意味着端点对匿名用户开放。攻击者可直接访问管理端点获取密钥或触发部署。'
      fix_pattern: '在类级别添加 [Authorize(Roles = "Admin")]，或在 Program.cs 中配置 RequireAuthenticatedUser() 作为默认策略。'
  mitigation_rules:
    - 所有关键功能必须在入口处执行服务端认证检查，不可依赖前端隐藏或客户端标记。
    - 认证状态必须从可信源（Session/Token/DB）实时获取，禁止可变布尔标志。
    - 对所有通信通道（HTTP/WebSocket/GraphQL/gRPC/SSE）实施统一认证。
    - 基础设施层（S3/DB/Redis）须独立配置访问控制，不依赖应用层认证。
    - 实施 Default Deny 策略：全局默认 authenticated，仅显式放行公开端点。
    - 调试/测试/内部端点在部署时必须移除或通过 IP 白名单/VPN 限制访问。

anti_patterns:
  - description
  - unprotected_admin_endpoint
  - class_level_boolean_auth
  - debug_endpoint_exposed
  - secondary_channel_bypass

output_schema:
  vulnerability_confirmed: boolean
  confidence: float (0-1)
  cwe_mapping: CWE-306
  critical_function_type: 'array — 关键功能类型 (如 [''data_creation'', ''sensitive_data_access'', ''admin_operation'', ''resource_intensive'', ''infrastructure_exposure'', ''debug_endpoint''])'
  missing_auth_location: string (指出应在何处添加认证检查)
  endpoint_auth_map: 'array — 关键端点认证状态表 [{path, method, auth_status: required|permitAll|method_guard|unconfigured}]'
  auth_state_flaw: string (若存在不可靠认证状态，描述具体问题)
  anti_pattern_hit: 'array — 命中的反向模式 (如 [''unprotected_admin_endpoint.java'', ''debug_endpoint_exposed.python''])'
  control_missing: 'array — 缺失的安全控制 (如 [''global_auth_filter'', ''method_level_auth'', ''security_config_coverage''])'
  secondary_channel_found: boolean — 是否发现绕过认证的替代通道
  reasoning_trace: string
  business_impact: string
  risk_level: CRITICAL
  remediation: string
