# CWE-863 分析推理流程

reasoning_workflow:
  - 'Step 0: 【定位授权判断点】找到代码中用于决定资源访问权限的条件分支（if/switch/annotation），识别授权决策变量（role/permission/isAdmin/access_level）。'
  - 'Step 1: 【追溯判断依据来源】该条件依赖的变量（如 $role, $isAdmin）是从哪里赋值的？追踪完整的数据流赋值链。'
  - 'Step 2: 【评估数据可信度】若来自 Cookie/Header/URL 参数 → 高风险（客户端可控）；若来自 Session/Token 解析/DB 查询 → 相对可信；若为硬编码字符串 → 需检查是否覆盖所有路径。对照 anti_patterns.client_trusted_authorization 和 control_detection_patterns.server_side_authorization。'
  - 'Step 3: 【检查授权完整性】授权检查是否仅验证登录状态而未验证角色？仅验证角色而未验证资源归属？对照 anti_patterns.incomplete_authorization_check 和 anti_patterns.role_only_check。'
  - 'Step 4: 【检查绕过可能性】是否存在不经过该判断即可到达敏感操作的路径？（如 else 分支缺失、异常处理跳过校验、可选认证参数）。'
  - 'Step 5: 【验证业务语义匹配】即使数据来源可信，判断逻辑是否符合业务预期？（如仅校验角色未校验资源归属 = 水平越权；仅校验登录未校验角色 = 垂直越权）。'
  - 'Step 6: 【检查硬编码权限】权限判断是否使用硬编码值或简单字符串比较，可能被类型混淆或注入绕过。对照 anti_patterns.hardcoded_permission_check。'
  - 'Step 7: 【检查多层校验】是否存在多层校验（角色+资源归属+租户隔离），单层失败是否导致整体拒绝。对照 control_detection_patterns.complete_authorization_chain。'
  - 'Step 8: 【八项确认标准】缺一不得 confirmed：(1)授权数据来自服务端可信源 (2)授权检查完整（认证+角色+归属）(3)无绕过路径 (4)业务语义匹配 (5)无硬编码权限 (6)使用授权框架 (7)多层校验 (8)异常路径 fail-closed'

knowledge_injection:
  few_shot_examples:
    - code_snippet: '$role = $_COOKIES[''role''];
if (!$role) {
    $role = getRole(''user'');
    setcookie(''role'', $role);
}
if ($role == ''Reader'') {
    DisplayMedicalHistory($_GET[''patient_id'']);
}'
      vulnerability_analysis: '授权决策完全依赖客户端 Cookie。攻击者可直接设置 Cookie: role=Reader 绕过 getRole() 调用。即使有默认回退机制，Cookie 仍可被篡改为任意值。这是典型的''信任客户端输入作为授权依据''缺陷。'
      fix_pattern: '$role = $_SESSION[''role'']; // 从服务端 Session 获取，不可由客户端设置。同时验证当前用户对 patient_id 有访问权限。'
    - code_snippet: '@PostMapping("/admin/promote")
public void promoteUser(@RequestBody PromoteRequest req) {
    userService.setRole(req.getUserId(), "ADMIN");
}'
      vulnerability_analysis: 管理接口无任何角色检查。任何已认证用户均可调用此接口将任意用户（包括自己）提升为管理员。仅有认证（登录）而无授权（角色校验），属于典型的垂直越权。
      fix_pattern: '@PreAuthorize("hasRole(''SUPER_ADMIN'')") public void promoteUser(..., @AuthenticationPrincipal User admin) { auditLog.record(admin.getId(), "PROMOTE_USER", req.getUserId()); }'
    - code_snippet: '@app.delete("/api/posts/{post_id}")
async def delete_post(post_id: int, current_user: User = Depends(get_current_user)):
    post = await Post.get(id=post_id)
    if post.author_id == current_user.id:
        await post.delete()
    else:
        raise HTTPException(403)'
      vulnerability_analysis: 仅校验帖子作者可删除，但未允许管理员/版主删除违规内容。这是不完整的授权检查——缺少管理员例外逻辑，属于授权逻辑缺陷（CWE-863）而非完全缺失（CWE-862）。
      fix_pattern: 'if post.author_id == current_user.id or current_user.role in [''admin'', ''moderator'']: await post.delete() else: raise HTTPException(403)'
    - code_snippet: 'app.get(''/admin/dashboard'', (req, res) => {
    const role = req.cookies.role || ''user'';
    if (role === ''admin'') {
        res.json(getAdminData());
    } else {
        res.status(403).json({error: ''Forbidden''});
    }
});'
      vulnerability_analysis: '角色从 Cookie 读取，攻击者可直接设置 Cookie: role=admin 获取管理员仪表板数据。授权决策完全依赖客户端可控的 Cookie 值。'
      fix_pattern: 'const role = req.user.role; // 从 JWT/Session 中获取服务端验证的角色; 使用中间件: app.get(''/admin/dashboard'', authMiddleware, requireRole(''admin''), ...)'
    - code_snippet: 'func AdminHandler(c *gin.Context) {
    role := c.GetHeader("X-User-Role")
    if role == "admin" {
        c.JSON(200, getAdminData())
    } else {
        c.JSON(403, gin.H{"error": "forbidden"})
    }
}'
      vulnerability_analysis: '角色从 HTTP Header 读取，攻击者可设置 X-User-Role: admin 绕过授权。Header 完全由客户端控制，不可作为授权依据。'
      fix_pattern: 'role := c.GetString("role") // 从 JWT 中间件注入的 context 获取; 使用中间件: r.GET("/admin", AuthRequired(), AdminRequired(), AdminHandler)'
    - code_snippet: '[HttpGet("admin/settings")]
public IActionResult GetSettings()
{
    var role = Request.Headers["X-Role"].ToString();
    if (role == "Admin")
        return Ok(GetAdminSettings());
    return Forbid();
}'
      vulnerability_analysis: '角色从 HTTP Header X-Role 读取，攻击者可直接设置 X-Role: Admin 获取管理员设置。即使有 [Authorize] 在控制器级别，该方法使用客户端 Header 而非 Claims 做授权决策。'
      fix_pattern: '使用 [Authorize(Roles = "Admin")] 注解，或 var role = User.FindFirst(ClaimTypes.Role)?.Value; 从 Claims 获取服务端验证的角色。'
  mitigation_rules:
    - 授权决策必须基于服务端可信状态（Session/Token/DB），绝不使用客户端直接提交的权限标识（Cookie/Header/URL 参数）。
    - 实施 Default Deny：未明确授权的请求一律拒绝，而非依赖前端隐藏或客户端标记。
    - 区分通用资源访问控制与业务级授权（如医疗记录需同时校验角色+患者归属关系）。
    - 使用成熟授权框架（Spring Security / Django Guardian / CASL / CanCanCan / Pundit）避免手写易错逻辑。
    - 授权检查必须完整：认证（是否登录）+ 角色（是否有权限）+ 资源归属（是否为当前用户的资源）。
    - 多层校验中任何一层失败都应导致整体拒绝（Defense in Depth）。

anti_patterns:
  - description
  - client_trusted_authorization
  - incomplete_authorization_check
  - hardcoded_permission_check
  - role_only_check

output_schema:
  vulnerability_confirmed: boolean
  confidence: float (0-1)
  cwe_mapping: CWE-863
  flaw_type: 'array — 授权缺陷类型 (如 [''client_trust'', ''incomplete_check'', ''logic_bypass'', ''hardcoded_permission'', ''role_only_no_ownership''])'
  untrusted_source: 'string (指出具体哪个变量来自不可信源，如 ''$_COOKIE["role"]'' 或 ''req.headers["x-role"]'')'
  anti_pattern_hit: 'array — 命中的反向模式 (如 [''client_trusted_authorization.php'', ''incomplete_authorization_check.java''])'
  control_missing: 'array — 缺失的安全控制 (如 [''server_side_authorization'', ''complete_authorization_chain'', ''framework_authorization''])'
  reasoning_trace: string (必须包含对数据流可信度的分析推理)
  business_impact: 'string (从 common_consequences 映射: 垂直越权/水平越权/信息泄露)'
  risk_level: CRITICAL
  remediation: 'string (结合 potential_mitigations 生成，强调''服务端重验''原则)'
