# CWE-276 分析推理流程

reasoning_workflow:
  - 'Step 0: 【识别资源初始化点】定位文件系统操作（创建文件/目录）、云存储配置（S3/OSS Bucket）、或部署安装脚本（Dockerfile/Shell）。'
  - 'Step 1: 【检查显式权限分配】分析代码中是否显式赋予了过于宽松的权限（如 `chmod 777`、`0o666`、`rwxrwxrwx`、`PublicRead`）。'
  - 'Step 2: 【评估默认 Umask 依赖】若未显式指定权限，检查是否修改了系统 `umask`（如 `umask 0`），或依赖了不安全的操作系统默认值，导致新建文件默认对 Group/Others 可读写。'
  - 'Step 3: 【检查云存储与IaC配置】在 Terraform/CloudFormation/SDK 中，检查存储桶或数据库实例是否默认开启了 Public Access 或绑定了 `0.0.0.0/0` 且无认证。'
  - 'Step 4: 【评估安装目录安全性】检查 Web 根目录、配置文件目录或临时目录（/tmp）是否被设置为全局可写（World-Writable），这可能导致 Symlink 攻击或 Webshell 植入。'
  - 'Step 5: 【确认最小权限原则】验证权限设置是否严格遵循“仅 Owner 可读写（如 600/700）”的最小特权原则。'
  - 'Step 6: 【六项确认标准】缺一不得 confirmed'

knowledge_injection:
  few_shot_examples:
    - code_snippet: 'os.chmod(''/etc/myapp/config.ini'', 0o777)'
      vulnerability_analysis: 将敏感配置文件设置为 777（全局可读、可写、可执行）。系统上的任何普通用户或低权限入侵者均可读取敏感凭据或篡改配置，导致权限提升或系统被接管。
      fix_pattern: '使用 os.chmod(''/etc/myapp/config.ini'', 0o600)，确保只有文件所有者（通常是运行该服务的特权用户或专用服务账户）可以读写。'
    - code_snippet: '# Docker Compose
services:
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
  redis:
    ports:
      - "6379:6379"'
      vulnerability_analysis: 'Docker Compose 中 MySQL 使用默认密码 root 且允许空密码，Redis 无密码且绑定到 0.0.0.0:6379。攻击者可直接连接数据库获取全部数据，或连接 Redis 执行任意命令。'
      fix_pattern: '使用 Docker Secrets 管理密码：MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password；Redis 配置 --requirepass 和 --bind 127.0.0.1。'
    - code_snippet: '@PostConstruct
public void init() {
    if (userRepository.count() == 0) {
        User admin = new User("admin", encoder.encode("admin123"));
        admin.setRole("ADMIN");
        userRepository.save(admin);
    }
}'
      vulnerability_analysis: 系统初始化时创建硬编码默认管理员账户 admin/admin123。攻击者可使用已知凭据登录并获得管理员权限。缺少强制首次修改密码机制。
      fix_pattern: 'String randomPassword = generateSecurePassword(); log.warn("Initial admin password: {}", randomPassword); admin.setMustChangePassword(true);'
    - code_snippet: 's3.create_bucket(Bucket=''company-backups'', ACL=''public-read'')'
      vulnerability_analysis: '在创建云存储桶时显式指定了 `public-read` ACL，导致包含敏感备份数据的存储桶对互联网任何人公开可读，引发严重的数据泄露事件。'
      fix_pattern: '移除 `ACL=''public-read''`，默认使用 `private`。通过 IAM 策略或 Pre-signed URL 授予特定用户或角色的访问权限，并开启 S3 Block Public Access 功能。'
  mitigation_rules:
    - 严格遵循最小权限原则（Principle of Least Privilege），文件/目录默认权限应设置为 600（文件）或 700（目录）。
    - '禁止在代码或脚本中使用 `chmod 777` 或 `0o777`，禁止将 `umask` 设置为 `000`。'
    - 云存储资源（S3/OSS/Blob）必须默认私有，并强制开启“阻止公共访问（Block Public Access）”特性。
    - 在 Dockerfile 或安装脚本中，明确指定非 root 用户运行，并严格限制应用目录的所有权和权限。

anti_patterns:
  - description
  - world_writable_files
  - public_cloud_storage
  - default_admin_credentials
  - overprivileged_service

output_schema:
  vulnerability_confirmed: boolean
  confidence: float (0-1)
  cwe_mapping: CWE-276
  resource_type: 'enum[''local_file'', ''directory'', ''cloud_storage_bucket'', ''database_instance'', ''ipc_shared_memory'']'
  permission_flaw: 'string (描述具体的权限缺陷，如 ''chmod 777'', ''S3 public-read ACL'', ''umask 000'')'
  missing_least_privilege: 'string (指出应采用的正确权限，如 ''应设置为 0o600'')'
  reasoning_trace: string
  business_impact: string
  risk_level: HIGH
  remediation: string
