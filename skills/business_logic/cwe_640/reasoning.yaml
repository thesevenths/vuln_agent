# CWE-640 分析推理流程

reasoning_workflow:
  - 'Step 0: 【识别恢复入口】定位处理“忘记密码”、“重置密码”、“验证 OTP”或“安全问题”的控制器与服务方法。'
  - 'Step 1: 【评估验证凭据强度】检查系统是否依赖弱验证机制（如静态安全问题、易被社工获取的个人信息、无防暴破的 4/6 位 SMS OTP）。'
  - 'Step 2: 【检查重置 Token 安全性】验证 Token 生成是否具备高熵（如 UUIDv4/SecureRandom），是否设置了合理的短过期时间（如 15-30 分钟），且是否为一次性使用（用后即焚）。'
  - 'Step 3: 【检查 IDOR 与参数篡改】在提交新密码的最终步骤中，检查系统是否依赖客户端传递的 `userId`、`username` 或 `email` 参数，而不是从服务端 Session 或可信 Token 中解析用户身份。'
  - 'Step 4: 【检查 OTP/验证码防暴破】若依赖短信/邮件验证码，检查验证接口是否实施了严格的速率限制（Rate Limiting）和尝试次数锁定，防止 4-6 位数字被爆破。'
  - 'Step 5: 【检查流程逻辑完整性】确认重置流程是否允许跳过验证步骤直接调用更新密码接口，或允许重复使用已消费的重置 Token。'
  - 'Step 6: 【六项确认标准】缺一不得 confirmed'

knowledge_injection:
  few_shot_examples:
    - code_snippet: 'public void resetPassword(String token, String userId, String newPwd) { User u = userRepo.findById(userId); u.setPassword(hash(newPwd)); userRepo.save(u); tokenRepo.delete(token); }'
      vulnerability_analysis: '存在严重的 IDOR（不安全的直接对象引用）漏洞。更新密码时直接信任客户端传入的 `userId` 参数。攻击者只需获取任意一个合法的重置 Token，并在请求中篡改 `userId` 为目标受害者的 ID，即可重置任意用户的密码。'
      fix_pattern: '严禁信任客户端传入的 userId。必须通过 `tokenRepo.findByToken(token)` 获取绑定的 User 对象，并仅更新该 Token 所属用户的密码。'
    - code_snippet: 'if (user.getSecurityAnswer().equalsIgnoreCase(inputAnswer)) { sendResetLink(user.getEmail()); }'
      vulnerability_analysis: 依赖静态“安全问题”（如母亲的姓名、出生地）作为密码恢复的验证凭据。这类信息极易通过社交媒体或社会工程学获取，导致攻击者轻易绕过验证并接管账户。
      fix_pattern: 废弃基于静态知识的安全问题。应采用带外验证（Out-of-Band），如向已验证的邮箱/手机发送包含高熵、短效、一次性 Token 的重置链接或 OTP。
  mitigation_rules:
    - 废弃基于静态知识的“安全问题”作为唯一的恢复凭据。
    - 重置 Token 必须使用密码学安全的伪随机数生成器（CSPRNG），具备高熵、短效（<30分钟）且一次性使用（用后立即失效）。
    - '密码更新动作必须从服务端验证过的 Token 或 Session 中获取用户身份，严禁信任客户端传递的 `userId` 或 `username` 参数。'
    - 对 OTP 验证码实施严格的防暴破机制（如 5 次失败锁定 IP 或账户，并限制发送频率）。

output_schema:
  vulnerability_confirmed: boolean
  confidence: float (0-1)
  cwe_mapping: CWE-640
  recovery_mechanism_type: 'enum[''security_questions'', ''email_link_token'', ''sms_otp'', ''admin_manual_reset'', ''hybrid'']'
  weakness_type: 'array — 存在的机制缺陷 (如 [''predictable_token'', ''idor_user_param'', ''weak_security_questions'', ''otp_no_ratelimit'', ''token_reuse''])'
  token_lifecycle_flaw: 'string (若存在 Token 生命周期缺陷，如''Token 未设置过期时间''或''Token 可重复使用'')'
  reasoning_trace: string
  business_impact: string
  risk_level: HIGH
  remediation: string
