# CWE-841 分析推理流程

reasoning_workflow:
  - 'Step 0: 【识别多步业务流程】定位涉及多步骤的业务流程（注册、支付、审批、购物车结算、订单处理等），识别状态字段（step/status/stage/phase）和终态操作（支付确认、发货、激活等）。'
  - 'Step 1: 【绘制状态机】列出到达敏感终态（付款成功、审批通过、账户激活）的合法前置步骤与状态机约束。枚举所有合法的状态转换路径。'
  - 'Step 2: 【检查步骤跳过】是否存在直接调用终态 API 的入口：绕过 /checkout/shipping 和 /checkout/payment 直接调用 /checkout/confirm。对照 anti_patterns.step_skipping 和 control_detection_patterns.precondition_validation。'
  - 'Step 3: 【检查客户端状态控制】工作流状态（step/status/stage）是否由客户端参数（URL param、form field、hidden field、cookie）控制。命中 anti_patterns.client_controlled_state 则直接标记 High。'
  - 'Step 4: 【评估状态存储安全性】工作流状态是否在服务端持久化（数据库/服务端 session/Redis），而非存储在客户端 hidden field 或 cookie 中。对照 control_detection_patterns.server_side_state_storage。'
  - 'Step 5: 【检查步骤重复利用】应一次性执行的步骤（支付、优惠券使用、奖励领取）是否可被重复调用。对照 anti_patterns.idempotency_gap。'
  - 'Step 6: 【检查步骤重排序】是否可以乱序执行步骤（如先退款再支付、先发货再确认地址）。验证每个步骤是否检查了前序步骤的完成状态。'
  - 'Step 7: 【评估竞态攻击】并发请求是否可使工作流步骤竞态执行（如同时提交两次支付），跳过中间状态验证。'
  - 'Step 8: 【检查延迟篡改】验证与操作之间的 TOCTOU 窗口：在价格审批后、实际支付前，客户端是否可篡改订单内容。'
  - 'Step 9: 【八项确认标准】缺一不得 confirmed：(1)状态机完整校验 (2)前置条件验证 (3)状态服务端存储 (4)步骤不可跳过 (5)步骤不可重复 (6)步骤不可乱序 (7)竞态攻击防护 (8)延迟篡改防护'

knowledge_injection:
  few_shot_examples:
    - code_snippet: '@PostMapping("/checkout/confirm")
public String confirmOrder(@RequestParam Long orderId) {
    Order order = orderRepo.findById(orderId).orElseThrow();
    order.setStatus(OrderStatus.CONFIRMED);
    orderRepo.save(order);
    paymentService.charge(order.getTotal());
    return "Order confirmed";
}'
      vulnerability_analysis: 确认订单接口仅校验 orderId 存在，未验证订单是否已完成地址填写（shipping）与支付授权（payment authorization）步骤。攻击者可跳过中间页面，直接调用 POST /checkout/confirm?orderId=1 完成订单，绕过所有中间验证步骤。
      fix_pattern: 'if (order.getStatus() != OrderStatus.PAYMENT_AUTHORIZED) throw new IllegalStateException("Order not ready for confirmation"); if (!order.isShippingComplete()) throw new IllegalStateException("Shipping not complete");'
    - code_snippet: '@PostMapping("/order/ship")
public void shipOrder(@PathVariable Long orderId, @RequestParam String status) {
    Order order = orderRepo.findById(orderId).get();
    order.setStatus(OrderStatus.valueOf(status));  // 客户端控制状态!
    orderRepo.save(order);
}'
      vulnerability_analysis: 订单状态完全由客户端 status 参数控制。攻击者可传入 status=SHIPPED 直接将未支付订单标记为已发货，或传入 status=DELIVERED 标记为已送达以触发退款。客户端不应控制状态转换。
      fix_pattern: '使用状态机：if (!stateMachine.canTransition(order.getStatus(), SHIPPED)) throw new ForbiddenException(); 且状态转换仅允许内部服务调用。'
    - code_snippet: '@app.post("/checkout/step/{step_id}")
async def process_step(step_id: int, order_id: int):
    order = await Order.get(id=order_id)
    order.current_step = step_id  # 客户端可跳步
    await order.save()
    return {"next_step": step_id + 1}'
      vulnerability_analysis: 工作流步骤完全由客户端 step_id 参数控制。攻击者可直接调用 POST /checkout/step/5 跳过步骤 1-4，或回退到已完成步骤重复执行。服务端未维护独立的步骤完成状态。
      fix_pattern: '服务端维护步骤完成状态：completed_steps = order.get_completed_steps(); if step_id not in get_allowed_next_steps(completed_steps): raise HTTPException(403)'
    - code_snippet: '@app.post("/payment/process")
async def process_payment(order_id: int, amount: float):
    order = await Order.get(id=order_id)
    # 无幂等性控制，可重复扣款
    await Payment.create(order_id=order_id, amount=amount)
    order.status = ''paid''
    await order.save()'
      vulnerability_analysis: 支付处理无幂等性控制。攻击者（或网络重试）可对同一订单发起多次支付请求，导致重复扣款。缺少 idempotency key 和支付状态检查。
      fix_pattern: 'if order.status == ''paid'': return {''status'': ''already_paid''}; 使用幂等键：idemp_key = f''payment:{order_id}:{user_id}''; if await redis.exists(idemp_key): raise DuplicateRequestException()'
    - code_snippet: 'app.post(''/checkout'', async (req, res) => {
    const { orderId, step, couponCode } = req.body;
    const order = await Order.findByPk(orderId);
    
    if (step === ''payment'') {
        // 可被直接调用，跳过地址确认步骤
        await processPayment(order, req.body.paymentInfo);
        order.status = ''paid'';
    }
    await order.save();
    res.json(order);
});'
      vulnerability_analysis: 单一端点通过客户端 step 参数控制工作流进度。攻击者可直接发送 step=payment 跳过前面的地址确认步骤。无服务端步骤完成状态追踪。
      fix_pattern: '独立端点 + 服务端状态机：if (order.status !== ''address_confirmed'') return res.status(403).json({error: ''Address not confirmed''}); await processPayment(order); order.status = ''paid'';'
    - code_snippet: 'func ConfirmOrder(c *gin.Context) {
    orderId := c.Param("orderId")
    order, _ := db.GetOrder(orderId)
    // 无前置步骤验证
    order.Status = "confirmed"
    db.SaveOrder(order)
    c.JSON(200, gin.H{"status": "confirmed"})
}'
      vulnerability_analysis: 确认订单无前置步骤验证。Go 没有框架级工作流保护，完全依赖开发者手动实现状态机。攻击者可跳过所有中间步骤直接确认订单。
      fix_pattern: 'if order.Status != "payment_authorized" { c.JSON(403, gin.H{"error": "order not ready"}); return }; order.Status = "confirmed"; db.SaveOrder(order)'
  mitigation_rules:
    - 服务端维护完整的工作流状态机，每个步骤的前置条件必须显式验证。
    - 工作流状态必须由服务端独立计算和存储（数据库/服务端 session），禁止客户端控制。
    - 敏感终态操作（支付、发货、激活）需要不可伪造的服务端会话状态或签名 token。
    - 每步完成后在服务端持久化状态，客户端无法单独声明已完成前置步骤。
    - 一次性操作（支付、优惠券使用、奖励领取）必须实施幂等性控制（唯一约束/防重 token）。
    - 工作流步骤的顺序必须由服务端强制，客户端不可指定当前步骤或跳步。
    - 使用不可预测的 token 或签名绑定工作流进度，防止客户端伪造步骤完成状态。

anti_patterns:
  - description
  - step_skipping
  - client_controlled_state
  - hidden_field_state
  - idempotency_gap

output_schema:
  vulnerability_confirmed: boolean
  confidence: float (0-1)
  cwe_mapping: CWE-841
  workflow_bypass_type: 'array — 工作流绕过类型 (如 [''step_skipping'', ''client_controlled_state'', ''step_repetition'', ''step_reordering'', ''race_condition_bypass'', ''late_mutation''])'
  bypass_path: 'string (具体绕过路径，如 ''POST /checkout/confirm 跳过 shipping 和 payment 步骤'')'
  missing_state_check: 'string (缺失的状态验证，如 ''未验证 order.status == PAYMENT_AUTHORIZED'')'
  anti_pattern_hit: 'array — 命中的反向模式 (如 [''step_skipping.java'', ''client_controlled_state.python''])'
  control_missing: 'array — 缺失的安全控制 (如 [''state_machine_enforcement'', ''precondition_validation'', ''server_side_state_storage''])'
  reasoning_trace: string
  business_impact: 'string (如 ''0元购、未付款发货、重复退款'')'
  risk_level: HIGH
  remediation: string
