# CWE-22 检测模式

ast_patterns:
  - 'Call[name=~/(File|FileInputStream|FileOutputStream|Files\.|Paths\.get|Path\.resolve|getResourceAsStream|FileCopyUtils)/i]'
  - 'Call[name=~/(new File|createTempFile|copy|move|write|readAllBytes)/i]'
  - 'Param[name=~/(path|filename|filePath|file|dir|directory|location)/i]'

semantic_keywords:
  - file upload
  - file download
  - path
  - directory
  - traversal
  - ../
  - file read
  - file write
  - resource
  - attachment

file_context:
  - controller
  - upload_handler
  - download_handler
  - file_service

logic_query_keywords_generic:
  file_ops:
    - open
    - readFile
    - writeFile
    - sendFile
    - download
    - upload
    - path.join
    - os.path.join
  sanitize_calls:
    - basename
    - realpath
    - normalize
    - sanitize
    - whitelist

sanitizers:
  - 路径经过 normalize() + startsWith(basePath) 双重校验
  - 文件名通过白名单正则校验（仅允许字母数字和安全的特殊字符）
  - 使用 getCanonicalPath() 解析后与基目录比对
  - 框架级路径遍历防护已启用（如 Spring 的 ResourceHttpRequestHandler）
