  - cwe: CWE-521
    reason: weak_password_requirements - 硬编码密码往往同时是弱密码（如 admin/admin123）
  - cwe: CWE-276
    reason: incorrect_default_permissions - 硬编码默认管理员凭据是默认权限过高的常见原因
  - cwe: CWE-312
    reason: cleartext_storage_of_sensitive_information - 硬编码凭据通常以明文形式存储在代码或配置中

