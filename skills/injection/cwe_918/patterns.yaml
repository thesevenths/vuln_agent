# CWE-918 检测模式

ast_patterns:
  - 'HTTPHandler[method=~/(GET|POST)/i][calls_outbound_http=true]'
  - 'Call[name=~/(RestTemplate|WebClient|HttpClient|URLConnection|openStream|URI\.create|new URL)/i]'
  - 'Param[name=~/(url|uri|link|callback|webhook|redirect|imageUrl|fetch)/i]'

semantic_keywords:
  - webhook
  - callback
  - fetch url
  - import from url
  - avatar
  - preview
  - redirect_uri
  - open redirect
  - metadata
  - '169.254'
  - localhost
  - 127.0.0.1
  - internal
  - allowlist
  - blocklist
  - dns rebinding
  - 'file://'
  - gopher

file_context:
  - controller
  - integration
  - webhook
  - import
  - preview
  - oauth

logic_query_keywords_generic:
  outbound_clients:
    - http
    - fetch
    - request
    - curl
    - open_stream
  defense_patterns:
    - allowlist
    - block_private
    - no_redirect
    - dns_pinning

sanitizers:
  - URL 仅允许匹配预定义 allowlist 的 host（非黑名单 alone）
  - '请求前 DNS 解析并拒绝 RFC1918、127.0.0.0/8、169.254.0.0/16、::1 等地址'
  - '禁止 file://、gopher:// 等危险 scheme；禁用或严格校验重定向'
  - 该功能仅运维内网可调用且经网络 ACL 隔离（需 L2 证据，且仍建议代码层校验）
