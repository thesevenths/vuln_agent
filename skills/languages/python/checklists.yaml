# Python 安全审计检查清单
# 按漏洞类别组织，供 LLM 分析时参考

# ── 授权类 ──
authorization:
  - "所有写操作视图是否有权限装饰器/中间件保护？"
  - "管理视图是否有独立的角色限制？"
  - "DRF permission_classes 是否覆盖所有 APIView？"
  - "IDOR：用外部传入的资源 ID 查询时是否校验 owner/tenant？"
  - "Django: filter 查询是否包含 user=request.user 条件？"

# ── 认证类 ──
authentication:
  - "密码存储是否使用强哈希（PBKDF2/Argon2/BCrypt）？"
  - "JWT 密钥是否硬编码？算法是否为 none/HS256？"
  - "登录接口是否有暴力破解防护？"
  - "Session Cookie 是否设置 HttpOnly/Secure/SameSite？"
  - "密码恢复流程是否有 IDOR / 弱 Token 风险？"

# ── 业务逻辑类 ──
business_logic:
  - "订单金额/价格是否在服务端重新计算？"
  - "多步骤流程能否跳过中间步骤？"
  - "ModelForm / Pydantic model 是否限制了可绑定字段？"
  - "并发操作（扣款/库存）是否有 select_for_update / atomic 保护？"
  - "TOCTOU：检查与使用之间是否存在竞态窗口？"

# ── 注入类 ──
injection:
  - "SQL 是否使用 ORM / 参数化查询？是否有 raw() / execute()？"
  - "用户输入是否拼接到 os.system / subprocess？"
  - "XML 解析是否使用 defusedxml？"
  - "反序列化 pickle.loads 是否处理不可信数据？"
  - "文件路径是否经过规范化 + 白名单校验？"
  - "SSRF：出站请求 URL 是否经过白名单校验？"

# ── 信息泄露 ──
information_exposure:
  - "DEBUG = True 是否在 production 关闭？"
  - "API 响应是否返回密码哈希/Token/内部 ID？"
  - "异常栈是否暴露给客户端？"
  - "日志中是否包含敏感数据？"
  - "源码/配置中是否有硬编码凭据？"

# ── 配置类 ──
configuration:
  - "SECRET_KEY 是否使用环境变量而非硬编码？"
  - "ALLOWED_HOSTS 是否正确配置？"
  - "CORS 是否允许任意 Origin？"
  - ".env 文件是否在 .gitignore 中？"
  - "数据库连接字符串是否使用环境变量？"
