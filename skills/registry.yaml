# ── 语言 -> 框架信号 -> 加载哪些语言 skill ─────────────────────────────────
language_profiles:
  java:
    framework_signals:
      spring_security: ["SpringSecurity", "spring-security-config", "spring-boot-starter-security"]
      shiro: ["org.apache.shiro", "shiro-spring", "shiro-web"]
      jaxrs: ["javax.ws.rs", "jakarta.ws.rs", "jersey", "resteasy"]
    always_load: [auth_controls, source_patterns, endpoint_discovery, cwe_patterns]
    conditional_load:
      spring_security: [spring_security]
      shiro: [shiro_security]

  python:
    framework_signals:
      django: ["django", "djangorestframework"]
      flask: ["flask", "flask-login", "flask-jwt"]
      fastapi: ["fastapi"]
    always_load: [auth_controls, source_patterns, endpoint_discovery, cwe_patterns]
    conditional_load:
      django: [django_permissions]
      flask: [flask_auth]

